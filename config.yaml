    PERFIL ACADÊMICO:
    Produção: O PAPEL DAS ATIVIDADES EXPERIMENTAIS NO FOMENTO DA APRENDIZAGEM COLABORATIVA DE CIÊNCIAS NOS ANOS INICIAIS
    Resumo: ESSA DISSERTAÇÃO TEM POR OBJETIVOS GERAIS INVESTIGAR O DESENVOLVIMENTO DA ALFABETIZAÇÃO CIENTÍFICA NAS SÉRIES INICIAIS ATRAVÉS DO ENSINO POR INVESTIGAÇÃO REALIZADO POR EXPERIMENTOS; E VERIFICAR O PROCESSO ARGUMENTATIVO DOS ALUNOS E OS INDICADORES DA ALFABETIZAÇÃO CIENTÍFICA POR MEIO DO ENSINO INVESTIGATIVO. PRETENDE-SE, AINDA, IDENTIFICAR O PROCESSO ARGUMENTATIVO DOS ALUNOS ATRAVÉS DO ENSINO POR INVESTIGAÇÃO NAS AULAS DE CIÊNCIAS DA NATUREZA; ANALISAR QUAIS INDICADORES DA ALFABETIZAÇÃO CIENTÍFICA SÃO DESENVOLVIDOS NOS ESTUDANTES NO PROCESSO ARGUMENTATIVO; VERIFICAR SE A REALIZAÇÃO DE EXPERIMENTOS E SIMULAÇÕES EM SALA DE AULA FAVORECE A APROPRIAÇÃO DE CONHECIMENTOS CIENTÍFICOS ESTRUTURADOS NOS EIXOS DA ALFABETIZAÇÃO CIENTÍFICA. A QUESTÃO-PROBLEMA ELABORADA PARA SER RESPONDIDA É A SEGUINTE: EM QUE MEDIDA OS EXPERIMENTOS E SIMULAÇÕES FAVORECEM A APROPRIAÇÃO DA CIÊNCIA EM ESTUDANTES DAS SÉRIES INICIAIS? A ABORDAGEM É QUALITATIVA, RECORRENDO À PESQUISA BIBLIOGRÁFICA PARA COMPOR O REFERENCIAL TEÓRICO DA PESQUISA, RAZÃO PELA QUAL SE PODE CONSIDERÁ-LA TAMBÉM COMO EXPLORATÓRIA. TAMBÉM É PESQUISA DE CAMPO E APLICADA, ENQUANTO SERÃO APLICADOS EXPERIMENTOS EM SALAS DE AULA DE UMA ESCOLA PÚBLICA DO MUNICIPAL DE SOROCABA/SP, SENDO UTILIZADA, TAMBÉM, A TÉCNICA DE OBSERVAÇÃO PARA ANÁLISE DAS ATIVIDADES REALIZADAS PELOS ALUNOS NO DECORRER DAS AULAS EXPERIMENTAIS E INVESTIGATIVAS. A ANÁLISE DOS DADOS ABRANGERÁ UMA ABORDAGEM SOBRE OS ARGUMENTOS DOS ALUNOS DE TURMAS DAS SÉRIES INICIAIS DO ENSINO FUNDAMENTAL, CONJUGANDO-SE COM O PADRÃO DE ARGUMENTAÇÃO FISHER ET AL (2002), DAS TRANSCRIÇÕES DAS FALAS ARGUMENTATIVAS DOS ALUNOS. A ANÁLISE IRÁ CONSIDERAR A PRESENÇA – OU NÃO – DOS EIXOS DA ALFABETIZAÇÃO CIENTÍFICA NAS ARGUMENTAÇÕES.
    Palavras-chave: ALFABETIZAÇÃO CIENTÍFICA;SÉRIES INICIAIS;EXPERIMENTOS;APRENDIZAGEM COLABORATIVA;ARGUMENTAÇÃO
    Área de Concentração: EDUCAÇÃO

