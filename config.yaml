    Palavras-chave: desenvolvimento sustentável, economia verde, segurança hídrica, inovação tecnológica, universalização do saneamento, gestão de recursos hídricos, infraestrutura de saneamento, educação ambiental, parcerias interinstitucionais, mudanças climáticas

    PERFIL ACADÊMICO:
    Produção: PRODUÇÕES DE TECNOLOGIA SOCIAL NOS PROGRAMAS DE PÓS-GRADUAÇÃO DA UNIVERSIDADE FEDERAL DO MARANHÃO: PERSPECTIVAS E POSSIBILIDADES
    Resumo: O OBJETIVO DA PESQUISA É IDENTIFICAR AS PRODUÇÕES DE TECNOLOGIAS SOCIAIS (TS) NOS PROGRAMAS DE PÓS-GRADUAÇÃO DA UNIVERSIDADE FEDERAL DO MARANHÃO E PROPOR A ELABORAÇÃO DE INSTRUMENTOS DE DIVULGAÇÃO PARA A COMUNIDADE ACADÊMICA E LOCAL. JUSTIFICA-SE PELA NECESSIDADE DE VISIBILIDADE, CONHECIMENTO E INCENTIVO À PRODUÇÃO DE TS NA ACADEMIA, A PARTIR DA DIVULGAÇÃO DE SOLUÇÕES INOVADORAS DESENVOLVIDAS EM DIFERENTES ÁREAS DO ENSINO, PESQUISA E EXTENSÃO DA UNIVERSIDADE. CONSIDERA-SE, AINDA, QUE AS TS SÃO FERRAMENTAS QUE LEVAM AO EMPODERAMENTO DA PRÓPRIA INSTITUIÇÃO, UMA VEZ QUE ATENDERÃO ÀS DEMANDAS DA SOCIEDADE NO QUE SE REFERE À DIMINUIÇÃO DOS ÍNDICES DE DESIGUALDADES SOCIAIS. PRETENDENDO ATINGIR OS OBJETIVOS, REALIZOU-SE OS PROCEDIMENTOS METODOLÓGICOS EM DUAS FASES: A PRIMEIRA, FOI ATRAVÉS DA COLETA DE DADOS ATRAVÉS DE LEVANTAMENTO BIBLIOGRÁFICO PARA ENTENDIMENTO SOBRE AS TS; JÁ A SEGUNDA FASE FOI DIVIDIDA EM TRÊS ETAPAS: NA ETAPA INICIAL, FOI ATRAVÉS DA PESQUISA EXPLORATÓRIA COM OBJETIVO DE IDENTIFICAR AS PRODUÇÕES DOS MESTRADOS COM PROPOSIÇÃO DE TS, BUSCANDO-SE MATERIAIS NOS SITES DOS PROGRAMAS DE PÓS-GRADUAÇÃO E NO PORTAL DA BIBLIOTECA DIGITAL DE TESES E DISSERTAÇÕES DA UFMA, SENDO SELECIONADOS TRABALHOS QUE APRESENTAVAM CARACTERÍSTICAS DAS TS, ATRAVÉS DOS PARÂMETROS PROPOSTOS PELO INSTITUTO DE TECNOLOGIA SOCIAL (ITS), FUNDAÇÃO BANCO DO BRASIL (FBB), PROJETOS DE LEI N.º 111/2011 E N.º 3329/2015, QUE CRIAM A POLÍTICA NACIONAL DE TECNOLOGIA SOCIAL (PNLS); NA ETAPA INTERMEDIÁRIA, APLICOU-SE QUESTIONÁRIOS A ACADÊMICOS QUE DESENVOLVERAM TRABALHOS DE CONCLUSÃO DE CURSOS DE PÓS-GRADUAÇÃO, COM CARACTERÍSTICAS DE TS, E AOS COORDENADORES DE CURSOS DE PÓSGRADUAÇÃO (MESTRADO) COM OBJETIVO DE ANALISAR A VIABILIDADE DA PRODUÇÃO DE TS; POR FIM, OS DADOS DA PESQUISA FORAM ORGANIZADOS NA FORMA DE RELATÓRIO TÉCNICO CONCLUSIVO (RTC) E DISPONIBILIZADOS À INSTITUIÇÃO FONTE DA PESQUISA (UFMA). APRESENTA-SE, COMO RESULTADO DO MAPEAMENTO DOS TRABALHOS DE PÓS-GRADUAÇÃO STRICTO SENSU NA UNIVERSIDADE FEDERAL DO MARANHÃO, A ANÁLISE DE 1.937 TRABALHOS, TOTALIZANDO 24 TRABALHOS COM CARACTERÍSTICAS E PARÂMETROS DE TS. A PARTIR DA DISCUSSÃO, FOI CONDUZIDA UMA ANÁLISE TEMÁTICA PARA AVERIGUAR SE ESTES TRABALHOS SEGUIAM TODOS OS PADRÕES PROPOSTOS PARA UMA TS. O ESTUDO VISA INCENTIVAR A UTILIZAÇÃO DO CONHECIMENTO PRODUZIDO NA UNIVERSIDADE PARA COMBATER OS PROBLEMAS SOCIOECONÔMICOS, PRINCIPAL MOTIVO DE ALINHAMENTO COM A TS, E QUE REFORÇA O PAPEL DAS INSTITUIÇÕES PÚBLICAS COMO DA UNIVERSIDADE FEDERAL DO MARANHÃO. COM ESTE ESTUDO, CONCLUI-SE QUE AS TECNOLOGIAS SOCIAIS SÃO FERRAMENTAS IMPORTANTES DE INCLUSÃO SOCIAL, ALÉM DE AUXILIAR NA FORMAÇÃO ACADÊMICA POR MEIO DA PESQUISA E EXTENSÃO. NO ENTANTO, A PRODUÇÃO DE TS NO MEIO ACADÊMICO NÃO É CONSTANTE. O QUE EVIDENCIA A NECESSIDADE DE ADEQUAÇÃO DA UNIVERSIDADE AOS PRINCÍPIOS E PARÂMETROS QUE POSSAM LHE CONCEDER O STATUS DE INSTITUIÇÃO NÃO COMO ASSISTENCIALISTA E SIM DE PROTAGONISTA NO COMBATE ÀS VULNERABILIDADES SOCIAIS.
    Palavras-chave: TECNOLOGIA SOCIAL;SUSTENTABILIDADE;UNIVERSIDADE PÚBLICA;PESQUISA E EXTENSÃO
    Área de Concentração: PROPRIEDADE INTELECTUAL E TRANSFERÊNCIA DE TECNOLOGIA PARA INOVAÇÃO

