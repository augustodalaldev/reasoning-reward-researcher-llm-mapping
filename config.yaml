# =============================================================================
# paper2026 — Configuração Global
# Classificação de Afinidade Perfil-Tema de Pesquisadores Brasileiros
# Dataset: LeanDL-HPC 2025
# =============================================================================

project:
  name: "paper2026"
  seed: 133
  device: "cuda"

# -----------------------------------------------------------------------------
# Paths
# -----------------------------------------------------------------------------
paths:
  raw_data:       "data/raw/leandl_oesnpg_dados.parquet"
  2class_training: "data/processed/2class/df_treino_estratificado_70_10_20_2class_truncated.parquet"
  2class_validation: "data/processed/2class/df_validacao_estratificado_70_10_20_2class_truncated.parquet"
  2class_test: "data/processed/2class/df_teste_estratificado_70_10_20_2class_truncated.parquet"
  3class_training: "data/processed/3class/df_treino_estratificado_70_10_20_3class_truncated.parquet"
  3class_validation: "data/processed/3class/df_validacao_estratificado_70_10_20_3class_truncated.parquet"
  3class_test: "data/processed/3class/df_teste_estratificado_70_10_20_3class_truncated.parquet"
  processed_dir:  "data/processed"
  models_dir:     "models"
  outputs_dir:    "outputs"
  logs_dir:       "outputs/logs"
  results_dir:    "outputs/results"
  plots_dir:      "outputs/plots"

# -----------------------------------------------------------------------------
# Classificação
# -----------------------------------------------------------------------------
classification:
  mode: "3class" # "3class" | "2class"
  labels_3class: ["ALTA", "MEDIA", "BAIXA"]
  labels_2class: ["ALTA", "BAIXA"]
  experiment: "sft_cot" #base, few_shot, sft, sft_cot ou grpo

# -----------------------------------------------------------------------------
# Modelo Base
# -----------------------------------------------------------------------------
model:
  name: "unsloth/Qwen3-14B-unsloth-bnb-4bit"
  grpo_name: "/home/augusto/paper_2026/experiments/paper2026/models/sft_cot_2class_qwen/lora_adapters" #modelo sft_cot 3 class, mudar de acordo com necessidade
  max_seq_length: 2560
  load_in_4bit: true
  dtype: "bfloat16"

# -----------------------------------------------------------------------------
# LoRA (Compartilhado)
# -----------------------------------------------------------------------------
lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0
  target_modules:
    - "q_proj"
    - "k_proj"
    - "v_proj"
    - "o_proj"
    - "gate_proj"
    - "up_proj"
    - "down_proj"
  bias: "none"
  use_gradient_checkpointing: "unsloth"
  random_state: 133
  use_rslora: true

# -----------------------------------------------------------------------------
# SFT — Supervised Fine-Tuning
# -----------------------------------------------------------------------------
sft:
  adapter_name: "{experiment}_{mode}_{model}"
  output_dir:   "models/{experiment}_{mode}_{model}"
  num_train_epochs: 3
  per_device_train_batch_size: 64
  per_device_eval_batch_size:  1
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-4
  warmup_ratio: 0.05
  lr_scheduler_type: "cosine"
  weight_decay: 0.01
  fp16: false
  bf16: true
  logging_steps: 20
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  report_to: "none"
  optim: "adamw_8bit"
  packing: True

# -----------------------------------------------------------------------------
# GRPO — Group Relative Policy Optimization
# -----------------------------------------------------------------------------
grpo:
  adapter_name: "{experiment}_{mode}_{model}"
  output_dir:   "models/{experiment}_{mode}_{model}"
  num_train_epochs: 1
  per_device_train_batch_size: 32
  gradient_accumulation_steps: 1
  learning_rate: 5.0e-6
  max_grad_norm: 0.1
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  bf16: true
  fp16: false
  optim: "adamw_8bit"
  report_to: "none"
  num_generations: 4
  max_prompt_length: 1536
  max_completion_length: 1024
  temperature: 0.7
  beta: 0.001
  logging_steps: 5
  save_steps: 50
  save_total_limit: 3
  rwfn_accuracy_mode: "standard" #standard ou distance

# -----------------------------------------------------------------------------
# Inferência (vLLM)
# -----------------------------------------------------------------------------
inference:
  tensor_parallel_size: 1
  gpu_memory_utilization: 0.90
  max_model_len: 8192
  max_new_tokens: 1024
  temperature: 0.0
  top_p: 1.0
  repetition_penalty: 1.1
  batch_size: 64

# -----------------------------------------------------------------------------
# Prompts
# -----------------------------------------------------------------------------
prompts:
  system_base: |
    Você é um especialista em análise semântica e classificação temática acadêmica. 
    Sua tarefa é analisar a afinidade entre um perfil acadêmico (baseado em sua área, resumo e palavras-chave) e um tema estratégico e realizar uma classificação.

  system_3class: |
    {system_base}
    
    Classifique o nível de afinidade utilizando ESTRITAMENTE uma destas três categorias:
    * ALTA: há forte e evidente relação entre as competências do perfil e o tema.
    * MEDIA: há proximidade semântica parcial ou tangencial entre o perfil e o tema.
    * BAIXA: há pouca ou nenhuma correspondência semântica real entre o tema e o perfil.

  system_2class: |
    {system_base}
    
    Classifique o nível de afinidade utilizando ESTRITAMENTE uma destas duas categorias:
    * ALTA: há forte relação ou clara proximidade semântica entre as competências do perfil e o tema.
    * BAIXA: há pouca ou nenhuma correspondência semântica real, sendo a relação fraca ou inexistente.

  dados_template: |
    TEMA ESTRATÉGICO:
    Nome: {nome_tema}
    Palavras-chave: {palavras_chave_tema}

    PERFIL ACADÊMICO:
    Produção: {nome_producao_perfil}
    Resumo: {resumo_perfil}
    Palavras-chave: {palavras_chave_perfil}
    Área de Concentração: {area_concentracao_perfil}

  base_instruction: |
    Avalie os dados abaixo e classifique a afinidade. 
    Responda APENAS com a palavra da classe adequada, sem incluir explicações ou formatação adicional.
    
    {dados}

  grpo_instruction: |
    Avalie os dados abaixo e classifique a afinidade.
    Primeiro, escreva sua justificativa detalhada comparando o perfil e o tema dentro das tags <think> e </think>.
    Depois, forneça ESTRITAMENTE a classe final (apenas uma palavra) dentro das tags <answer> e </answer>.
    
    {dados}

  sft_cot_assistant: |
    <think>
    {justificativa_final}
    </think>
    <answer>{nivel_classificacao}</answer>

  sft_assistant: |
    {nivel_classificacao}

  few_shot_examples_3class: |

    (EXEMPLO CLASSE: ALTA)

    TEMA ESTRATÉGICO:
    Nome: Turismo: gestão e hospitalidade
    Palavras-chave: eventos turísticos, observatório do turismo, ordenamento territorial, desenvolvimento sustentável, turismo sustentável, atração de investimentos, capacitação profissional, apoio à temporada de praia, infraestrutura turística, promoção do turismo

    PERFIL ACADÊMICO:
    Produção: TURISMO SUSTENTÁVEL EM PRAIA DE RIO: PERCEPÇÃO AMBIENTAL NA PRAIA DA TARTARUGA NO MUNICÍPIO DE PEIXE – TOCANTINS
    Resumo: O BRASIL DETÉM GRANDES PATRIMÔNIOS NATURAIS, O QUE PERMITE UMA OFERTA TURÍSTICA DIVERSIFICADA NO SEU TERRITÓRIO. NO ESTADO DO TOCANTINS, AS PRAIAS DE RIOS SÃO ATRATIVOS MUITO PROCURADOS DURANTE O PERÍODO DE ESTIAGEM, EM ESPECIAL, NOS MESES DE JULHO E AGOSTO. ESTE TRABALHO INVESTIGOU A PERCEPÇÃO AMBIENTAL SOBRE O TURISMO NA PRAIA DA TARTARUGA, NO MUNICÍPIO DE PEIXE, TOCANTINS. O TURISMO PODE SER UMA ATIVIDADE SUSTENTÁVEL, COM VIABILIDADE ECONÔMICA, SE FOR PLANEJADO E DELINEADO, CONSIDERANDO TODAS AS DIMENSÕES QUE O ENVOLVEM, COMO A DIMENSÃO AMBIENTAL, ECONÔMICA E SOCIAL, MAS PODE APRESENTAR IMPACTOS NEGATIVOS EM GRANDES PROPORÇÕES, QUANDO NÃO EXISTE PLANEJAMENTO, FISCALIZAÇÃO OU PREOCUPAÇÃO AMBIENTAL NO DESTINO TURÍSTICO. A PRAIA DA TARTARUGA É UMA PRAIA DE RIO, LOCALIZADA NA REGIÃO SUL DO ESTADO DO TOCANTINS, NO MUNICÍPIO DE PEIXE. A ATIVIDADE TURÍSTICA NA LOCALIDADE JÁ É CONSOLIDADA, ATRAINDO MUITAS PESSOAS NA TEMPORADA DE PRAIA. ASSIM, ESTE ESTUDO PROPÔS VERIFICAR, ATRAVÉS DA REALIZAÇÃO DE ENTREVISTAS, A PERCEPÇÃO AMBIENTAL DE TURISTAS E DE PRESTADORES DE SERVIÇOS, TRANSPORTE E COMÉRCIO QUE ATUAM DURANTE A TEMPORADA NO ATRATIVO. A PESQUISA É DE CARÁTER QUALITATIVO, DE CUNHO FENOMENOLÓGICO. A ANÁLISE DOS DADOS FOI INTERPRETADA COM BASE NO MÉTODO FENOMENOLÓGICO DE COLAIZZI. IDENTIFICOU-SE QUE OS TURISTAS POSSUEM ENTENDIMENTO SOBRE O TURISMO SUSTENTÁVEL, MAS, AINDA ASSIM, PRATICAM ATITUDES QUE CAUSAM DANOS AO MEIO AMBIENTE. O LUGAR FOI CONSIDERADO SEGURO PARA OS ENTREVISTADOS, QUE SE SENTEM BEM EM MEIO À PAISAGEM DO LUGAR E AVALIAM POSITIVAMENTE OS ASPECTOS QUE COMPÕEM A PAISAGEM. A MAIORIA DOS PRESTADORES DE SERVIÇOS DESCONHECE O CONCEITO DE SUSTENTABILIDADE, NÃO PERCEBEM OS DANOS DA ATIVIDADE TURÍSTICA NA PRAIA. DURANTE A TEMPORADA, ELES CONSEGUEM LUCRAR MAIS, EM UM ÚNICO MÊS, DO QUE TRABALHANDO, DIARIAMENTE, NA CIDADE EM SUAS EMPRESAS. NOS RESULTADOS SOBRE A PANDEMIA DE COVID 19, OS PRESTADORES DE SERVIÇO NARRARAM QUE FORAM MUITO PREJUDICADOS ECONOMICAMENTE, DE VÁRIAS FORMAS. ESSES DADOS MOSTRAM A IMPORTÂNCIA DO INVESTIMENTO EM EDUCAÇÃO AMBIENTAL E SUSTENTABILIDADE, DE UM DESTINO TURÍSTICO, PARA O DESENVOLVIMENTO DA ECONOMIA LOCAL, QUE DEPENDE DA CONSERVAÇÃO DESSE PATRIMÔNIO.
    Palavras-chave: TURISMO;SUSTENTABILIDADE;PERCEPÇÃO;RECURSOS NATURAIS;MEIO AMBIENTE.
    Área de Concentração: CIÊNCIAS DO AMBIENTE

    CLASSE PREVISTA:
    ALTA

    (EXEMPLO CLASSE: MEDIA)
    TEMA ESTRATÉGICO:
    Nome: Desertificação e Agricultura Regenerativa
    Palavras-chave: tecnologias sustentáveis, biodiversidade, governança ambiental, segurança hídrica, agricultura familiar, agroecologia, conservação de solo, sustentabilidade ambiental, mudanças climáticas

    PERFIL ACADÊMICO:
    Produção: AGRICULTURA URBANA E SEGURANÇA ALIMENTAR E NUTRICIONAL: UM ESTUDO DE CASO DA CONTRIBUIÇÃO DAS PRINCIPAIS HORTAS COMUNITÁRIAS POVO UNIDO (JUAZEIRO-BA) E ASSENTAMENTO MANDACARU (PETROLINA-PE)
    Resumo: AS HORTAS COMUNITÁRIAS CERTIFICADAS SÃO ESPAÇOS CAPAZES DE FORNECER PRODUTOS DE QUALIDADE E QUE GARANTEM A SOBERANIA ALIMENTAR, NUTRICIONAL DA POPULAÇÃO E O FORTALECIMENTO DA SEGURANÇA ALIMENTAR E NUTRICIONAL. ESSA PESQUISA APRESENTA AS DUAS MAIORES HORTAS ORGÂNICAS CERTIFICADAS DOS MUNICÍPIOS DE JUAZEIRO-BA E PETROLINA-PE. O OBJETIVO DA PESQUISA FOI VERIFICAR A RELEVÂNCIA DESSAS DUAS HORTAS PARA A POPULAÇÃO LOCAL, A IMPORTÂNCIA DA AGRICULTURA URBANA E PERIURBANA DE BASE ECOLÓGICA, NOS ASPECTOS ECONÔMICOS, AMBIENTAIS, CULTURAIS E SOCIAIS. BUSCA- SE IDENTIFICAR, ATRAVÉS DESSES ESPAÇOS, AS INSTITUIÇÕES ENVOLVIDAS NO PROCESSO DE FORTALECIMENTO DA PRODUÇÃO ORGÂNICA E AGROECOLÓGICA DAS DUAS CIDADES. A METODOLOGIA UTILIZADA FOI A ANÁLISE DOCUMENTAL, DE CARÁTER QUANTI-QUALITATIVO, ANÁLISE DE LITERATURA E PESQUISAS SOBRE AUTORES E TRABALHOS SOBRE O TEMA. ALÉM DA DESCRIÇÃO AUTONARRATIVA DA EXPERIÊNCIA PROFISSIONAL DA PESQUISADORA. OS AGRICULTORES/AS AINDA ENCONTRAM GRANDES DIFICULDADES NO QUE SE REFERE À COMERCIALIZAÇÃO E À FALTA DE POLÍTICAS PÚBLICAS QUE FORTALEÇAM ESSES ESPAÇOS. APESAR DISSO, MENCIONAM-SE ALGUMAS INICIATIVAS IMPORTANTES COMO AS FEIRAS DE ORGÂNICOS, O TRABALHO DAS UNIVERSIDADES, ATRAVÉS DE NÚCLEOS QUE DESENVOLVEM ESTUDOS E PESQUISAS EM AGROECOLOGIA, A CRIAÇÃO DA REDE DE AGROECOLOGIA E AS LEIS MUNICIPAIS CRIADAS NO MUNICÍPIO DE PETROLINA, ALÉM DA RECRIAÇÃO DO CONSELHO NACIONAL DE SEGURANÇA ALIMENTAR E NUTRICIONAL (CONSEA). FOI POSSÍVEL VERIFICAR QUE ESSAS INICIATIVAS SÃO FUNDAMENTAIS PARA DIRIMIR OS GARGALOS DA PRODUÇÃO ORGÂNICA DE BASE AGROECOLÓGICA NAS DUAS CIDADES. O PRODUTO APRESENTADO FOI UM PODCAST, ELABORADO ATRAVÉS DAS FALAS DE AGRICULTORES/AS, TÉCNICO E CONSUMIDOR.
    Palavras-chave: HORTAS COMUNITÁRIAS ORGÂNICAS;AGROECOLOGIA;POLÍTICAS PÚBLICAS;COMERCIALIZAÇÃO
    Área de Concentração: EXTENSÃO RURAL E DESENVOLVIMENTO

