    Nome: Meio Ambiente e Sustentabilidade
    Palavras-chave: reflorestamento, recuperação de áreas degradadas, conservação, biodiversidade, agricultura de baixo carbono, economia verde, gases de efeito estufa (GEE), poluição ambiental, mudanças climáticas, sustentabilidade ambiental

    PERFIL ACADÊMICO:
    Produção: AVALIAÇÃO SOCIAL DO CICLO DE VIDA DE BIOCOMBUSTÍVEIS
    Resumo: ATUALMENTE, OS BIOCOMBUSTÍVEIS APARECEM COMO UMA DAS PRINCIPAIS ALTERNATIVAS ENERGÉTICAS DE BAIXO CARBONO. NO ENTANTO, A MAIORIA DOS ESTUDOS FOCA APENAS NOS IMPACTOS AMBIENTAIS DOS BIOCOMBUSTÍVEIS, DESCONSIDERANDO SEUS IMPACTOS SOCIOECONÔMICOS. DESSA FORMA, O OBJETIVO DESTE TRABALHO FOI REALIZAR A AVALIAÇÃO SOCIAL DO CICLO DE VIDA DO BIODIESEL E ETANOL PRODUZIDOS DO CENTRO-OESTE BRASILEIRO ENTRE OS ANOS DE 2009 E 2019. A METODOLOGIA FOI ESTRUTURADA A PARTIR DA ISO 14040, QUE COMPÕE AS ETAPAS OBJETIVO E ESCOPO, ANÁLISE DE INVENTÁRIO, AVALIAÇÃO DOS IMPACTOS E INTERPRETAÇÃO. A UNIDADE FUNCIONAL DEFINIDA FOI UM ANO DE CICLO PRODUTIVO DE BIOCOMBUSTÍVEIS LÍQUIDOS NO CENTRO-OESTE BRASILEIRO. OS STAKEHOLDERS UTILIZADOS (TRABALHADORES, COMUNIDADE LOCAL E SOCIEDADE) FORAM DEFINIDOS A PARTIR DA LEITURA DA LITERATURA EXISTENTE. A ANÁLISE DOS IMPACTOS SOCIAIS DA PRODUÇÃO DOS BIOCOMBUSTÍVEIS FOI REALIZADA PARA CADA ATIVIDADE ECONÔMICA EXISTENTE NAS FASES AGRÍCOLA E INDUSTRIAL DO CICLO DE VIDA. A FIM DE ENTENDER A SUSTENTABILIDADE SOCIAL DO SETOR, FORAM CALCULADOS ÍNDICES DE SUSTENTABILIDADE SOCIAL (ISS). PARA TAL, FOI REALIZADA A NORMALIZAÇÃO DOS DADOS, E POSTERIORMENTE, UMA ANÁLISE MULTICRITÉRIO COM PESO 1 PARA TODAS AS CATEGORIAS DE IMPACTO AVALIADAS. OS RESULTADOS INDICAM QUE HOUVE UMA EVOLUÇÃO SOCIAL POSITIVA EM AMBAS AS FASES DO CICLO DE VIDA PRODUTIVO DOS BIOCOMBUSTÍVEIS NO PERÍODO ESTUDADO, PRINCIPALMENTE PELO AUMENTO DA ESCOLARIDADE DOS TRABALHADORES, EMPREGABILIDADE E DIMINUIÇÃO DO TRABALHO ESCRAVO. SABE-SE QUE A AVALIAÇÃO SOCIAL DO CICLO DE VIDA AINDA ENCONTRA ALGUNS OBSTÁCULOS COMO A DIFICULDADE DE MENSURAÇÃO DE DADOS QUALITATIVOS E AGREGAÇÃO DOS DADOS DISPONÍVEIS, A FIM DE SE ADEQUAR À REALIDADE. NESTE QUESITO, ESSE TRABALHO SE MOSTRA RELEVANTE, POR TER SIDO CAPAZ DE AUMENTAR A OBJETIVIDADE DA AVALIAÇÃO DE INDICADORES SOCIAIS, A PARTIR DE SUA QUANTIFICAÇÃO E DA UTILIZAÇÃO DE FERRAMENTAS ESTATÍSTICAS, COMO A ANÁLISE MULTICRITÉRIO.
    Palavras-chave: AVALIAÇÃO SOCIAL DO CICLO DE VIDA;BIOCOMBUSTÍVEIS;INDICADORES DE SUSTENTABILIDADE SOCIAL;ANÁLISE MULTICRITÉRIO
